{%extends 'base.html'%}



{%block content%}
{%if request.user.is_authenticated%}
{%for album in albums%}
<div>
    <h1 hx-get="/album/">albums</h1>
    <br/>
    <ul>
        <li hx-get="/album/{{album.id}}" hx-swap="outerHTML" hx-target="#main">
        {{album.Title}}
        </li>
    </ul>
</div>
{%endfor%}
{%endif%}
{%endblock%}
