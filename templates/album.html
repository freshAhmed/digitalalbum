{%extends 'base.html'%}



{%block content%}

{%for post in posts%}
<div hx-get="/posts/{{post.id}}" hx-swap="outerHTML",hx-target="#main">
<h1>Title:{{post.Title}}</h1>
<img src="{{post.image.url}}" alt="image" width="300px" height="300px">
<p>description:{{post.description}}</p>

</div>
{%endfor%}
{%endblock%}
