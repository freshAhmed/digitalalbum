


{%if post%}
<div>
<h1>Title:{{post.Title}}</h1>
<p>desription:{{post.description}}</p>
<img src="{{post.image.url}}" width="500" height="500" alt="image">
<button hx-get="/posts/edit/{{post.id}}" hx-swap="innerHTML" hx-target="#main">edit</button>

<button hx-get="/posts/remove/{{post.id}}" hx-swap="innerHTML" hx-target=".removeholder">remove</button>
<h1>hellworld</h1>
<span class="removeholder"></span>
</div>

{%endif%}
